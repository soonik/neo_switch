name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      rid:
        description: Runtime identifier (win-x64 / win-arm64)
        required: false
        default: win-x64

jobs:
  build:
    name: Build (${{ github.event.inputs.rid || 'win-x64' }})
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RID: ${{ github.event.inputs.rid || 'win-x64' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore
        run: dotnet restore

      - name: Publish (App + CLI, single-file, self-contained)
        shell: pwsh
        run: ./publish.ps1 -Rid $env:RID

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neoswitch-${{ env.RID }}
          path: |
            publish/NeoSwitch-*.zip
            publish/neoswitch-cli-*.zip
            publish/app/NeoSwitch.exe
            publish/cli/neoswitch.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            publish/NeoSwitch-*.zip
            publish/neoswitch-cli-*.zip
